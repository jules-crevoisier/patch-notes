# =============================================================================
# Apache vhost — patch-notes.fr (blog SSR + API).
# -----------------------------------------------------------------------------
# Reverse proxy vers le conteneur blog qui écoute sur 127.0.0.1:3001.
# Certbot (--apache) ajoutera ensuite le bloc <VirtualHost *:443> avec SSL et
# un RewriteRule de redirection HTTP → HTTPS.
# Modules requis :
#   sudo a2enmod proxy proxy_http headers deflate rewrite
# Activation :
#   sudo cp apache/sites-available/patch-notes.fr.conf /etc/apache2/sites-available/
#   sudo a2ensite patch-notes.fr
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d patch-notes.fr -d www.patch-notes.fr
# =============================================================================

<VirtualHost *:80>
	ServerName patch-notes.fr
	ServerAlias www.patch-notes.fr
	ServerAdmin admin@patch-notes.fr

	# Redirige www → apex AVANT que Certbot ajoute le SSL.
	# Après Certbot, ce vhost ne sert plus qu'à rediriger HTTP → HTTPS.
	RewriteEngine On
	RewriteCond %{HTTP_HOST} ^www\. [NC]
	RewriteRule ^(.*)$ https://patch-notes.fr$1 [R=301,L]

	# Conserve l'IP réelle pour les logs et le blog.
	RemoteIPHeader X-Forwarded-For
	RemoteIPInternalProxy 127.0.0.1

	# Compression (gzip / deflate). Apache2 a deflate par défaut.
	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json application/xml image/svg+xml
	</IfModule>

	# Headers de sécurité (HTTPS uniquement, mais on les active déjà).
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
		Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
		# HSTS sera ajouté par Certbot dans le vhost SSL.
		Header unset Server
		Header unset X-Powered-By
	</IfModule>

	# Reverse proxy vers le conteneur Docker du blog.
	ProxyPreserveHost On
	ProxyRequests Off
	ProxyTimeout 60

	# Forward des en-têtes attendus par le serveur Node.
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

	ProxyPass        / http://127.0.0.1:3001/ retry=0
	ProxyPassReverse / http://127.0.0.1:3001/

	ErrorLog  ${APACHE_LOG_DIR}/patch-notes.fr-error.log
	CustomLog ${APACHE_LOG_DIR}/patch-notes.fr-access.log combined
	LogLevel  warn
</VirtualHost>

# Note : après `sudo certbot --apache -d patch-notes.fr -d www.patch-notes.fr`,
# Certbot crée automatiquement /etc/apache2/sites-available/patch-notes.fr-le-ssl.conf
# avec un <VirtualHost *:443> qui réutilise les mêmes directives ProxyPass.
# Tu peux modifier ce fichier généré pour ajouter HSTS si Certbot ne l'a pas fait :
#
#   <VirtualHost *:443>
#     ...
#     Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
#     ...
#   </VirtualHost>
