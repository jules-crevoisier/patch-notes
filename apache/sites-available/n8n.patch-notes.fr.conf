# =============================================================================
# Apache vhost — n8n.patch-notes.fr (interface admin n8n).
# -----------------------------------------------------------------------------
# Reverse proxy avec WebSocket (l'éditeur n8n utilise WS pour le live update).
# Modules requis :
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite
# Activation :
#   sudo cp apache/sites-available/n8n.patch-notes.fr.conf /etc/apache2/sites-available/
#   sudo a2ensite n8n.patch-notes.fr
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d n8n.patch-notes.fr
#
# Sécurité : n8n est protégé par son propre basic auth (cf. .env), pas besoin
# de le doubler côté Apache.
# =============================================================================

<VirtualHost *:80>
	ServerName n8n.patch-notes.fr
	ServerAdmin admin@patch-notes.fr

	RemoteIPHeader X-Forwarded-For
	RemoteIPInternalProxy 127.0.0.1

	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
		Header unset Server
		Header unset X-Powered-By
	</IfModule>

	ProxyPreserveHost On
	ProxyRequests Off
	ProxyTimeout 600

	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

	# WebSocket : si la requête a Upgrade: websocket, on passe en ws://.
	# Doit venir AVANT les ProxyPass HTTP.
	RewriteEngine On
	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule /(.*) ws://127.0.0.1:5678/$1 [P,L]

	# Trafic HTTP normal.
	ProxyPass        / http://127.0.0.1:5678/ retry=0 timeout=600
	ProxyPassReverse / http://127.0.0.1:5678/

	ErrorLog  ${APACHE_LOG_DIR}/n8n.patch-notes.fr-error.log
	CustomLog ${APACHE_LOG_DIR}/n8n.patch-notes.fr-access.log combined
	LogLevel  warn
</VirtualHost>
