# =============================================================================
# Override Docker Compose pour la production (VPS Debian + Apache reverse proxy).
# -----------------------------------------------------------------------------
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Ou via le helper :
#   ./scripts/deploy.sh
#
# Différences avec le compose de dev :
#   - blog n'écoute que sur 127.0.0.1 (loopback) ; impossible de l'atteindre
#     depuis Internet, seul Apache (qui tourne sur l'hôte) peut le contacter
#     via 127.0.0.1:3001.
#   - postgres reste sur le réseau Docker, totalement invisible depuis l'hôte.
#   - resource limits, log rotation, restart=always, healthchecks stricts.
# =============================================================================

services:
  postgres:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G

  blog:
    restart: always
    # Bind sur la loopback uniquement : Apache fait le proxy.
    # Format : <host_ip>:<host_port>:<container_port>
    ports: !override
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?SITE_URL doit être défini en prod (https://ton-domaine).}
      BLOG_SECRET: ${BLOG_SECRET:?BLOG_SECRET doit être défini (32+ caractères).}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?IP_HASH_SECRET doit être défini (32+ caractères).}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
